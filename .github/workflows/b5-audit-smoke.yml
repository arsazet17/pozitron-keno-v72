name: B5 audit isolated smoke test
on:
  push:
    branches:
      - fix/b5-audit-reviewed-20261012
    paths:
      - '.github/workflows/b5-audit-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/b5-audit-reviewed-20261012
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing journal without modification
        run: node b5-journal.cjs --verify
      - name: Run B5 against copies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b5-audit-smoke
          cp b5-journal.cjs virtus-b5-module.js keno-history.json b5-journal.json /tmp/b5-audit-smoke/
          cd /tmp/b5-audit-smoke
          cp b5-journal.json original.json
          node b5-journal.cjs
          node b5-journal.cjs --verify --against=original.json
          node - <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('original.json'));
          const after=JSON.parse(fs.readFileSync('b5-journal.json'));
          if(after.records.length<before.records.length)throw Error('records lost');
          if(after.gaps.length<before.gaps.length)throw Error('gaps lost');
          console.log('SMOKE PASS records:',before.records.length,'->',after.records.length,'gaps:',before.gaps.length,'->',after.gaps.length);
          NODE
      - name: Syntax checks
        run: |
          node --check b5-journal.cjs
          node --check sprint-marathon.js
          node --check refresh-asset-versions.mjs
