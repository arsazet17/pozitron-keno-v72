name: Keno Auto · Stoloto MAIN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keno-auto.yml'
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: keno-stoloto-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Кто запустил workflow
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "ACTOR=$GITHUB_ACTOR"
          echo "RUN=$GITHUB_RUN_ID"

      - name: Получить самый свежий main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Синхронизировать рабочую копию с main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "WORKING_SHA=$(git rev-parse HEAD)"

      - name: Восстановить пропущенные факты из живой базы v6.3
        run: |
          set -euo pipefail
          LAST=$(node -e "const x=require('./keno-history.json'); console.log(Math.max(...x.map(r=>Number(r.draw)||0)))")
          echo "LOCAL_LAST=$LAST"
          if [ "$LAST" -lt 327824 ]; then
            echo "База v7.2 оборвана. Подмешиваю только недостающие факты из живой базы v6.3..."
            curl -fL --retry 3 --retry-delay 2 \
              https://raw.githubusercontent.com/arsazet17/arsazet17-pozitron-keno-v63/main/keno-history-v63.json \
              -o /tmp/keno-history-v63.json
            node <<'NODE'
          const fs=require('fs');
          const local=JSON.parse(fs.readFileSync('keno-history.json','utf8'));
          const donor=JSON.parse(fs.readFileSync('/tmp/keno-history-v63.json','utf8'));
          const byDraw=new Map(local.map(r=>[Number(r.draw),r]));
          const before=Math.max(...byDraw.keys());
          let added=0;
          for(const r of donor){
            const d=Number(r.draw);
            if(!Number.isInteger(d)||d<=before||byDraw.has(d)) continue;
            if(!Array.isArray(r.balls)||r.balls.length!==20) throw new Error(`v6.3: invalid balls at draw ${d}`);
            byDraw.set(d,r); added++;
          }
          const merged=[...byDraw.values()].sort((a,b)=>Number(a.draw)-Number(b.draw));
          const after=Math.max(...merged.map(r=>Number(r.draw)||0));
          if(after<=before) throw new Error(`v6.3 recovery did not advance archive: ${before} -> ${after}`);
          for(let d=before+1;d<=after;d++) if(!byDraw.has(d)) throw new Error(`Recovery gap remains at draw ${d}`);
          fs.writeFileSync('keno-history.json',JSON.stringify(merged,null,2)+'\n');
          console.log(`RECOVERY PASS: ${before} -> ${after}; added=${added}`);
          NODE
          else
            echo "Recovery not needed"
          fi

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Кэш Chromium Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.54.2-chromium

      - name: Установить Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Столото recovery tail30 · 3 проверки
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: |
          set -u
          sed 's/const TAIL_SIZE=10;/const TAIL_SIZE=30;/' stoloto-keno-update-v2.mjs > stoloto-keno-update-recovery.mjs
          ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "KENO v7.2 Stoloto attempt $attempt/6"
            if node stoloto-keno-update-recovery.mjs; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Reader failed; retry in 20 sec..."
              sleep 20
            fi
          done
          rm -f stoloto-keno-update-recovery.mjs
          if [ "$ok" -ne 1 ]; then
            echo "KENO v7.2 Stoloto reader failed after 6 attempts"
            exit 1
          fi

      - name: Пересчитать Спринт / Марафон при новом тираже
        run: |
          if git diff --quiet -- keno-history.json; then
            echo "Нового тиража нет — прогнозный JSON не пересчитываю"
            exit 0
          fi
          node keno-auto.js

      - name: Сохранить безопасное обновление
        run: |
          if git diff --quiet -- keno-history.json keno-auto.json; then
            echo "Изменений нет"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add keno-history.json keno-auto.json
          git commit -m "KENO v7.2 · recover facts from live v6.3 + Stoloto tail30"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
