name: Keno Auto · Stoloto MAIN

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: keno-stoloto-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Кто запустил workflow
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "ACTOR=$GITHUB_ACTOR"
          echo "RUN=$GITHUB_RUN_ID"

      - name: Получить самый свежий main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Синхронизировать рабочую копию с main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "WORKING_SHA=$(git rev-parse HEAD)"

      - name: Восстановить только пропущенные факты после отката
        run: |
          LAST=$(node -e "const x=require('./keno-history.json'); console.log(Math.max(...x.map(r=>Number(r.draw)||0)))")
          echo "LOCAL_LAST=$LAST"
          if [ "$LAST" -le 327784 ]; then
            echo "После отката база оборвана. Беру только keno-history.json из проверенного снимка 874a5fc..."
            git cat-file -e 874a5fc8c3a6742e2c72c1eb9d7d08f3850fe1c7:keno-history.json
            git show 874a5fc8c3a6742e2c72c1eb9d7d08f3850fe1c7:keno-history.json > keno-history.json.recovered
            RECOVERED_LAST=$(node -e "const x=require('./keno-history.json.recovered'); console.log(Math.max(...x.map(r=>Number(r.draw)||0)))")
            echo "RECOVERED_LAST=$RECOVERED_LAST"
            if [ "$RECOVERED_LAST" -lt 327824 ]; then
              echo "::error::Recovery snapshot is not new enough"
              exit 1
            fi
            mv keno-history.json.recovered keno-history.json
          else
            echo "Recovery not needed"
          fi

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Кэш Chromium Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.54.2-chromium

      - name: Установить Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Столото OAuth · robust tail10 · 3 проверки
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: |
          set -u
          ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "KENO v7.2 Stoloto attempt $attempt/6"
            if node stoloto-keno-update-v2.mjs; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Reader failed; retry in 20 sec..."
              sleep 20
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::KENO v7.2 Stoloto reader failed after 6 attempts"
            exit 1
          fi

      - name: Пересчитать Спринт / Марафон при новом тираже
        run: |
          if git diff --quiet -- keno-history.json; then
            echo "Нового тиража нет — прогнозный JSON не пересчитываю"
            exit 0
          fi
          node keno-auto.js

      - name: Сохранить безопасное обновление
        run: |
          if git diff --quiet -- keno-history.json keno-auto.json; then
            echo "Изменений нет"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add keno-history.json keno-auto.json
          git commit -m "KENO v7.2 · robust Stoloto tail10"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
