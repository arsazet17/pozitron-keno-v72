name: Keno Auto · Stoloto MAIN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keno-auto.yml'
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: keno-stoloto-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Кто запустил workflow
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "ACTOR=$GITHUB_ACTOR"
          echo "RUN=$GITHUB_RUN_ID"

      - name: Получить самый свежий main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Синхронизировать рабочую копию с main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "WORKING_SHA=$(git rev-parse HEAD)"

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Кэш Chromium Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.54.2-chromium

      - name: Установить Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Столото · последние 30 тиражей · до 6 попыток
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: |
          set -u
          sed 's/const TAIL_SIZE=10;/const TAIL_SIZE=30;/' stoloto-keno-update-v2.mjs > stoloto-keno-update-recovery.mjs
          ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "KENO v7.2 Stoloto attempt $attempt/6"
            if node stoloto-keno-update-recovery.mjs; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Reader failed; retry in 20 sec..."
              sleep 20
            fi
          done
          rm -f stoloto-keno-update-recovery.mjs
          if [ "$ok" -ne 1 ]; then
            echo "KENO v7.2 Stoloto reader failed after 6 attempts"
            exit 1
          fi

      - name: Сохранить безопасное обновление
        run: |
          if [ -z "$(git status --porcelain -- keno-history.json)" ]; then
            echo "Изменений нет"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add keno-history.json
          git commit -m "KENO v7.2 · новые тиражи Столото"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
