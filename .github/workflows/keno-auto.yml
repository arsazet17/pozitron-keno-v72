name: Keno Auto · Stoloto MAIN

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keno-stoloto-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Кто запустил workflow
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "ACTOR=$GITHUB_ACTOR"
          echo "RUN=$GITHUB_RUN_ID"

      - name: Получить самый свежий main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Синхронизировать рабочую копию с main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "WORKING_SHA=$(git rev-parse HEAD)"

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Кэш Chromium Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.54.2-chromium

      - name: Установить Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Столото OAuth · последние 10 · 3 проверки
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: node stoloto-keno-update.mjs

      - name: Пересчитать Спринт / Марафон при новом тираже
        run: |
          if git diff --quiet -- keno-history.json; then
            echo "Нового тиража нет — прогнозный JSON не пересчитываю"
            exit 0
          fi
          node keno-auto.js

      - name: Сохранить безопасное обновление
        run: |
          if git diff --quiet -- keno-history.json keno-auto.json; then
            echo "Изменений нет"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add keno-history.json keno-auto.json
          git commit -m "KENO v7.2 · Stoloto tail10 auto"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
