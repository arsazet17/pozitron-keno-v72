name: FIX localStorage quota ONCE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-localstorage-once
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Исправить localStorage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function save(){localStorage.setItem('pozitron_v5_draws',JSON.stringify(draws))}"
          new = "function save(){try{const cache=draws.slice(-800);localStorage.setItem('pozitron_v5_draws',JSON.stringify(cache))}catch(e){try{localStorage.removeItem('pozitron_v5_draws')}catch(_){}}}"
          if old not in s:
              raise SystemExit('FAIL: точная старая функция save() не найдена')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('PASS: save() теперь сохраняет только последние 800 тиражей')
          PY

      - name: Удалить одноразовый workflow
        run: git rm .github/workflows/fix-storage-once.yml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Исправить переполнение localStorage"
          git push
