name: Keno Auto · Stoloto RESERVE

on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 * * * *"

permissions:
  contents: write

concurrency:
  group: keno-stoloto-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Столото · 3 проверки · обновить историю
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: node stoloto-keno-update.mjs

      - name: Рассчитать Спринт / Марафон
        run: node keno-auto.js

      - name: Сохранить безопасное обновление
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "=== SAVE ATTEMPT $attempt/3 ==="
            git fetch origin main

            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "main изменился после checkout — пересчитываю на свежей базе"
              git reset --hard origin/main
              node stoloto-keno-update.mjs
              node keno-auto.js
            fi

            if git diff --quiet -- keno-history.json keno-auto.json; then
              echo "Изменений нет"
              exit 0
            fi

            git add keno-history.json keno-auto.json
            git commit -m "Столото · автообновление КЕНО"

            if git push origin HEAD:main; then
              echo "Обновление сохранено"
              exit 0
            fi

            echo "main снова изменился во время push — повторяю безопасно"
            git fetch origin main
            git reset --hard origin/main
            node stoloto-keno-update.mjs
            node keno-auto.js
          done

          echo "Не удалось сохранить после 3 безопасных попыток"
          exit 1
