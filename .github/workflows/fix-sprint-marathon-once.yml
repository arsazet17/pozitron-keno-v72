name: FIX Sprint Marathon official column ONCE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keno-stoloto-auto
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Исправить Спринт и Марафон
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------- keno-auto.js ----------
          p = Path("keno-auto.js")
          s = p.read_text(encoding="utf-8")

          old_winner = '''// Победитель полностью совпадает с экранным analysis():
// максимум чисел в столбце, при равенстве — кто раньше достиг максимума
// в порядке выпадения.
function winner(draw) {
  const final = counts(draw);
  const max = Math.max(...final.slice(1));
  const running = Array(11).fill(0);

  for (const raw of draw?.balls || []) {
    const c = colOf(Number(raw));
    running[c] += 1;
    if (running[c] === max) return c;
  }
  return 1;
}'''

          new_winner = '''// Для тиражей Столото используем только официальный "Столбец N".
// Старый расчёт оставлен исключительно для старых строк архива, где column ещё отсутствует.
function winner(draw) {
  const official = Number(draw?.column);
  if (Number.isInteger(official) && official >= 1 && official <= 10) {
    return official;
  }

  const final = counts(draw);
  const max = Math.max(...final.slice(1));
  const running = Array(11).fill(0);

  for (const raw of draw?.balls || []) {
    const c = colOf(Number(raw));
    running[c] += 1;
    if (running[c] === max) return c;
  }
  return 1;
}'''

          if old_winner not in s:
              raise SystemExit("FAIL keno-auto.js: функция winner() не совпала с ожидаемой")
          s = s.replace(old_winner, new_winner, 1)

          old_stamp = '''function drawStamp(d) {
  const dm = String(d?.date || '').match(/(\\d{1,2})[.\\/-](\\d{1,2})[.\\/-](\\d{4})/);
  const tm = String(d?.time || '').match(/(\\d{1,2}):(\\d{2})/);
  if (!dm || !tm) return null;
  return new Date(Number(dm[3]), Number(dm[2]) - 1, Number(dm[1]), Number(tm[1]), Number(tm[2])).getTime();
}'''

          new_stamp = '''function drawStamp(d) {
  const dm = String(d?.date || '').match(/(\\d{1,2})[.\\/-](\\d{1,2})[.\\/-](\\d{2}|\\d{4})/);
  const tm = String(d?.time || '').match(/(\\d{1,2}):(\\d{2})/);
  if (!dm || !tm) return null;
  const year = dm[3].length === 2 ? 2000 + Number(dm[3]) : Number(dm[3]);
  return new Date(year, Number(dm[2]) - 1, Number(dm[1]), Number(tm[1]), Number(tm[2])).getTime();
}'''

          if old_stamp not in s:
              raise SystemExit("FAIL keno-auto.js: drawStamp() не совпала с ожидаемой")
          s = s.replace(old_stamp, new_stamp, 1)
          p.write_text(s, encoding="utf-8")

          # ---------- sprint-marathon.js ----------
          p = Path("sprint-marathon.js")
          s = p.read_text(encoding="utf-8")

          old_cache = '''      drawCounts[i] = counts(list[i]);
      winnerCache[i] = Number(safeAnalysis(list[i]).winner) || 1;'''

          new_cache = '''      drawCounts[i] = counts(list[i]);
      const official = Number(list[i]?.column);
      winnerCache[i] = Number.isInteger(official) && official >= 1 && official <= 10
        ? official
        : (Number(safeAnalysis(list[i]).winner) || 1);'''

          if old_cache not in s:
              raise SystemExit("FAIL sprint-marathon.js: rebuildStateCache() не совпала с ожидаемой")
          s = s.replace(old_cache, new_cache, 1)

          if old_stamp not in s:
              raise SystemExit("FAIL sprint-marathon.js: drawStamp() не совпала с ожидаемой")
          s = s.replace(old_stamp, new_stamp, 1)
          p.write_text(s, encoding="utf-8")

          print("PASS: официальный column имеет приоритет")
          print("PASS: даты DD.MM.YY и DD.MM.YYYY поддерживаются")
          PY

      - name: Проверить JavaScript
        run: |
          node --check keno-auto.js
          node --check sprint-marathon.js

      - name: Удалить одноразовый workflow
        run: git rm .github/workflows/fix-sprint-marathon-once.yml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keno-auto.js sprint-marathon.js
          git commit -m "Спринт Марафон · официальный column и даты"
          git push
