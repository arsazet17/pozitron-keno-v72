name: FIX Sprint Marathon v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keno-stoloto-auto
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fix
        env:
          PATCH_B64: 
        run: python3 -c "import os,base64; exec(base64.b64decode(os.environ['PATCH_B64']).decode('utf-8'))"

      - name: Check JavaScript
        run: |
          node --check keno-auto.js
          node --check sprint-marathon.js

      - name: Remove one-time workflow
        run: git rm .github/workflows/fix-sprint-marathon-v2.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keno-auto.js sprint-marathon.js
          git commit -m "Спринт Марафон · официальный column и даты"
          git pull --rebase origin main
          git push
