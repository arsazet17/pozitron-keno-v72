name: INSTALL · KENO 7.2 Group Storage

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keno-v72-group-storage-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fresh main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить хранение групп
        run: node install-keno-v72-group-storage.cjs

      - name: Проверка
        shell: bash
        run: |
          set -euo pipefail
          node --check keno-auto.js
          grep -q "groupForecastSnapshot" keno-auto.js
          grep -q "groupForecast:" keno-auto.js
          grep -q "actualGroupState" keno-auto.js
          grep -q "groupTopHit" keno-auto.js
          grep -q "groupCovered" keno-auto.js
          grep -q "version: 4" keno-auto.js
          echo "CHECK PASS"

      - name: Сохранить
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- keno-auto.js; then
            echo "Изменений нет"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add keno-auto.js
          git commit -m "KENO v7.2 · frozen хранение групп Спринт/Марафон"
          git push origin HEAD:main
